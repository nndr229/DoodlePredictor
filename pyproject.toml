[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doodle-predictor"
version = "0.1.0"
authors = [
  { name="Nithin Deepkumar", email="nithindeepkumar@example.com" },
]
description = "A fast, NumPy-based neural network for predicting doodles."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scikit-learn",
    "pillow",
    "h5py"
]

[project.scripts]
doodle-predictor = "doodle_predictor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doodle_predictor"]
